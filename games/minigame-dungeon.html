<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minigame Dungeon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        display: block;
    }
</style>
</head>
<body>
    <img src="MinigameDungeon.png" alt="Minigame Dungeon">
    <audio id="lease-audio" src="../sounds/lease.mp3" autoplay loop></audio>
    <script>
        // Stop the loop when this tab is backgrounded (switched away from, or
        // the browser is minimized/exited on mobile), resume when it's foreground again.
        const leaseAudio = document.getElementById('lease-audio');
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                leaseAudio.pause();
            } else {
                leaseAudio.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
